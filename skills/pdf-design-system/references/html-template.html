<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- GOOGLE FONTS: Inter -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  /* PAGE SETUP */
  @page {
    size: A4;
    margin: 1.2cm 1.6cm;

    /* Page number at bottom right on content pages */
    @bottom-right {
      content: counter(page);
      font-family: 'Inter', Helvetica, Arial, sans-serif;
      font-size: 8.5pt;
      color: #666666;
      font-style: italic;
    }
  }

  /* No page number on the title page */
  @page :first {
    @bottom-right {
      content: none;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', Helvetica, Arial, sans-serif;
    color: #333333;
    font-size: 10pt;
    line-height: 1.5;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ===== TITLE PAGE ===== */
  .title-page {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 24cm;
    page-break-after: always;
  }

  .doc-title {
    font-size: 22pt;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 0.3cm;
    letter-spacing: 0.02em;
  }

  .doc-subtitle {
    font-size: 12pt;
    color: #2196A4;
    margin-bottom: 0.5cm;
  }

  .doc-meta {
    font-size: 9.5pt;
    color: #666666;
    margin-bottom: 1cm;
    padding-bottom: 0.4cm;
    border-bottom: 1px solid #4361EE;
  }

  .doc-abstract-label {
    font-size: 10pt;
    font-weight: 700;
    color: #4361EE;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.2cm;
  }

  .doc-abstract {
    font-size: 10pt;
    color: #333333;
    line-height: 1.5;
  }

  /* ===== SECTIONS ===== */
  .section {
    margin-bottom: 0.4cm;
  }

  .section-header {
    font-size: 12pt;
    font-weight: 700;
    color: #4361EE;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.15cm;
    padding-bottom: 0.08cm;
    border-bottom: 1px solid #4361EE;
  }

  .subsection-header {
    font-size: 11pt;
    font-weight: 700;
    color: #2196A4;
    margin-bottom: 0.1cm;
    margin-top: 0.2cm;
  }

  p {
    font-size: 10pt;
    color: #333333;
    line-height: 1.5;
    margin-bottom: 0.2cm;
  }

  /* ===== TABLES ===== */
  .table-wrap {
    margin: 0.2cm 0;
    width: 100%;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 9pt;
    font-family: 'Inter', Helvetica, sans-serif;
  }

  table th {
    background: #4361EE;
    color: white;
    font-weight: 600;
    padding: 0.2cm 0.3cm;
    text-align: left;
    font-size: 9pt;
  }

  table th.right {
    text-align: right;
  }

  table td {
    padding: 0.15cm 0.3cm;
    border-bottom: 0.5px solid #ddd;
    color: #333333;
    font-size: 9pt;
  }

  table td.right {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  table tr:nth-child(even) td {
    background: #f8f9ff;
  }

  /* ===== BULLETS ===== */
  .bullets {
    padding-left: 0.3cm;
    margin-bottom: 0.2cm;
  }

  .bullets .item {
    margin-bottom: 0.1cm;
    position: relative;
    padding-left: 0.6cm;
    text-indent: -0.6cm;
    font-size: 10pt;
    color: #333333;
    line-height: 1.5;
  }

  .bullets .item::before {
    content: "\2022 ";
    position: relative;
  }

  /* ===== STEPS ===== */
  .step-list {
    padding-left: 0.3cm;
    margin-bottom: 0.2cm;
  }

  .step-item {
    margin-bottom: 0.12cm;
    position: relative;
    padding-left: 0.6cm;
    text-indent: -0.6cm;
    font-size: 10pt;
    color: #333333;
    line-height: 1.5;
  }

  .step-item .num {
    color: #4361EE;
    font-weight: 700;
  }

  /* ===== FORMULA BOX ===== */
  .formula-box {
    background: #f8f9ff;
    border-left: 3px solid #4361EE;
    padding: 0.3cm 0.4cm;
    margin: 0.2cm 0;
    font-size: 10pt;
    color: #1a1a1a;
    line-height: 1.6;
  }

  .formula-box .hl {
    color: #4361EE;
    font-weight: 600;
  }

  /* ===== HIGHLIGHT BOX ===== */
  .highlight-box {
    background: #f0f4ff;
    border: 1px solid #4361EE;
    border-radius: 4px;
    padding: 0.3cm 0.4cm;
    margin: 0.2cm 0;
  }

  .highlight-box .label {
    font-size: 9pt;
    font-weight: 700;
    color: #4361EE;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.1cm;
  }

  .highlight-box .content {
    font-size: 10pt;
    color: #333333;
    line-height: 1.5;
  }

  /* ===== SKILLS (CV) ===== */
  .skills-group {
    margin-bottom: 0.12cm;
  }

  .skills-label {
    font-size: 10pt;
    font-weight: 700;
    color: #1a1a1a;
  }

  .skills-text {
    font-size: 10pt;
    color: #333333;
  }

  .lang-row {
    font-size: 10pt;
    color: #333333;
    margin-bottom: 0.08cm;
  }

  .lang-name { font-weight: 600; }
  .lang-level { color: #666666; font-style: italic; }

  /* ===== CV NAME HEADER ===== */
  .name {
    font-size: 16pt;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 0.1cm;
    letter-spacing: 0.02em;
  }

  .subtitle {
    font-size: 10pt;
    color: #2196A4;
    margin-bottom: 0.15cm;
  }

  .contact {
    font-size: 9.5pt;
    color: #666666;
    margin-bottom: 0.4cm;
    padding-bottom: 0.3cm;
    border-bottom: 0.5px solid #cccccc;
  }

  .entry {
    margin-bottom: 0.25cm;
  }

  .entry-title {
    font-size: 11pt;
    font-weight: 700;
    color: #1a1a1a;
  }

  .entry-company {
    font-size: 10pt;
    font-style: italic;
    color: #2196A4;
  }

  .entry-date {
    font-size: 9.5pt;
    font-style: italic;
    color: #666666;
  }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.05cm;
  }

  .entry-sub {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.1cm;
  }

  .page-break {
    page-break-before: always;
  }

  .footer-note {
    font-size: 8.5pt;
    color: #666666;
    font-style: italic;
    margin-top: 0.5cm;
    padding-top: 0.2cm;
    border-top: 0.5px solid #cccccc;
    text-align: center;
  }
</style>
</head>
<body>
  <!-- CONTENT GOES HERE -->
</body>
</html>
